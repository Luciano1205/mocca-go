<div style="background:#14100E;padding:32px 16px;font-family:Inter,Helvetica,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#221A16;border:1px solid #3A2F28;border-radius:16px;padding:32px 24px;text-align:center;">
    <p style="margin:0 0 4px;color:#F08A3C;font-size:20px;font-weight:700;">Mocca Go!</p>
    <h1 style="margin:16px 0 8px;color:#F5EDE3;font-size:22px;">Recupera tu contraseña</h1>
    <p style="margin:0 0 24px;color:#A8998C;font-size:15px;line-height:22px;">
      Escribe este código en la app para crear una nueva contraseña.
    </p>
    <div style="display:inline-block;background:#2E241F;border-radius:12px;padding:16px 24px;color:#F5EDE3;font-size:32px;font-weight:700;letter-spacing:8px;">
      {{ .Token }}
    </div>
    <p style="margin:24px 0 0;color:#A8998C;font-size:13px;line-height:20px;">
      El código vence en 1 hora. Si no pediste este cambio, ignora este correo.
    </p>
  </div>
</div>
